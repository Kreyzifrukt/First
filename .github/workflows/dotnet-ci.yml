name: .NET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore test project
        run: dotnet restore TaskTracker.Tests/TaskTracker.Tests.csproj

      - name: Run tests
        run: dotnet test TaskTracker.Tests/TaskTracker.Tests.csproj --configuration Release --no-restore

      - name: Build application
        run: dotnet build TaskTracker/TaskTracker.csproj --configuration Release
